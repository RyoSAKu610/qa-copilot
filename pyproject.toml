[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-copilot"
version = "0.1.0"
description = "Human-gated QA agent: discover, qualify, prepare, execute, report. Never auto-apply."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qa-copilot contributors" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.40"]

[project.scripts]
qa-copilot = "qa_copilot.cli:main"

[project.urls]
Homepage = "https://github.com/RyoSAKu610/qa-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
