# Copy to .qa-copilot/config.yaml if you want to *disable* sources.
# You cannot enable a source that policy.py marks disabled.
# You cannot turn paste-only sources into HTTP fetchers.

enabled:
  github_issues: true
  github_bounties: true
  remotive: true
  remoteok: true
  jobicy: true
  himalayas: true
  working_nomads: true
  arbeitnow: true
  fourdayweek: true
  careerjet: true
  adzuna: true        # needs ADZUNA_APP_ID / ADZUNA_APP_KEY
  hn_hiring: true
  # crowdworks/lancers/coconala/upwork: paste only — use `qa-copilot inbox add`
  # usertesting/utest/hackerone/bugcrowd: hard-disabled

# Environment overrides used by the aggregators:
#   ADZUNA_APP_ID / ADZUNA_APP_KEY   free key from developer.adzuna.com
#   ADZUNA_COUNTRIES                 default "jp,gb,us"
#   CAREERJET_AFFID                  default "0"
#   CAREERJET_LOCALES                default "ja_JP,en_GB"
#   GITHUB_TOKEN / GH_TOKEN          raises the GitHub Search rate limit
